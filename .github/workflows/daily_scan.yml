name: Daily Nifty 500 Scan + Portfolio

on:
  schedule:
    # Every 15 min, 03:00-10:59 UTC = 08:30-16:29 IST (pre-open to post-close)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nifty500-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (LIVE broker mode)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          EXECUTE_NOW=1 LIVE_MODE=1 python main.py

      - name: Commit state back to repo
        run: |
          git config user.name "bot"
          git config user.email "bot@nifty500"
          git add data/ logs/ -f
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "state: bot run $(TZ=Asia/Kolkata date +%Y-%m-%dT%H:%M) IST"
            git pull --rebase origin main
            git push
          fi
